<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ATELIER LINESHEET | B2B Showroom</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbars for smooth pill scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#111827] antialiased selection:bg-black selection:text-white">

  <!-- ================= TOP HEADER ================= -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-200/80 px-4 md:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 bg-black text-white flex items-center justify-center font-bold text-xs tracking-wider rounded">A</div>
      <span class="font-bold tracking-widest text-base uppercase">ATELIER STUDIO</span>
      <span class="hidden sm:inline-block text-[11px] font-semibold bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full border border-gray-200 uppercase tracking-wider">FW26 Linesheet</span>
    </div>

    <div class="flex items-center gap-4 text-xs font-medium text-gray-500">
      <span class="hidden md:inline">Toptan Satış Portalı</span>
      <button class="bg-black text-white px-3.5 py-1.5 rounded-full text-xs font-semibold hover:bg-gray-800 transition">
        Sipariş Listesi (0)
      </button>
    </div>
  </header>

  <!-- ================= MAIN LAYOUT ================= -->
  <!-- Masaüstünde: Yan Yana (Sol Görsel %55, Sağ Menü %45) -->
  <!-- Mobilde: Dikey (Üstte Görsel Sabit, Altta Kaydırılabilir Kontroller) -->
  <main class="max-w-[1700px] mx-auto min-h-[calc(100vh-57px)] flex flex-col lg:flex-row">

    <!-- SOL / ÜST: ANA VİTRİN GÖRSELİ -->
    <!-- Mobilde sticky top-14 (header altı), Masaüstünde tam yükseklik -->
    <section class="lg:w-[54%] w-full bg-[#ECEEF2] relative sticky top-[57px] lg:static z-20 flex items-center justify-center overflow-hidden border-b lg:border-b-0 lg:border-r border-gray-200 h-[46vh] sm:h-[50vh] lg:h-[calc(100vh-57px)]">
      
      <!-- Ana Resim Container -->
      <div class="relative w-full h-full flex items-center justify-center p-3 lg:p-8">
        <img id="mainProductImage" 
             src="" 
             alt="Ürün Görseli" 
             class="w-full h-full object-contain lg:object-cover rounded-2xl transition-all duration-500 ease-out shadow-sm" />

        <!-- Resim Üzerindeki Canlı Etiket (SKU & Renk) -->
        <div class="absolute bottom-4 left-4 lg:bottom-8 lg:left-8 bg-black/75 backdrop-blur-md text-white px-3 py-1.5 lg:px-4 lg:py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg">
          <span id="badgeColorDot" class="w-2.5 h-2.5 rounded-full border border-white/40"></span>
          <span id="badgeSku" class="font-bold tracking-wider">M1001</span>
          <span class="text-white/40">|</span>
          <span id="badgeColorName" class="text-gray-200">Mat Siyah</span>
        </div>

        <!-- Fiyat Rozeti -->
        <div class="absolute top-4 right-4 lg:top-8 lg:right-8 bg-white/90 backdrop-blur-md text-gray-900 px-3 py-1.5 rounded-xl text-xs font-bold border border-white/60 shadow-md">
          <span id="badgePrice">€185.00</span> <span class="text-[10px] font-normal text-gray-500">/ B2B Adet</span>
        </div>
      </div>
    </section>

    <!-- SAĞ / ALT: KONTROL PANELİ -->
    <section class="lg:w-[46%] w-full bg-white flex flex-col p-4 lg:p-8 overflow-y-auto">
      
      <!-- 1. KADEMELİ SEÇİM: KATEGORİLER -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-[11px] font-bold text-gray-400 tracking-wider uppercase">1. Kategori Seçimi</label>
          <span class="text-[11px] text-gray-400">5 Kategori</span>
        </div>
        <div id="categoryContainer" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          <!-- Kategoriler JS ile dolacak -->
        </div>
      </div>

      <!-- 2. KADEMELİ SEÇİM: ÜRÜN KODLARI (SKU) -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-[11px] font-bold text-gray-400 tracking-wider uppercase">2. Ürün Kodu (SKU)</label>
          <span id="skuCountLabel" class="text-[11px] text-gray-400">Ürünler</span>
        </div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <!-- Ürün kartları JS ile dolacak -->
        </div>
      </div>

      <!-- 3. KADEMELİ SEÇİM: RENKLER (TIKLAYINCA GÖRSEL DEĞİŞİR) -->
      <div class="mb-7 bg-gray-50 p-4 rounded-2xl border border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <div>
            <label class="text-[11px] font-bold text-gray-900 tracking-wider uppercase block">3. Renk Seçenekleri</label>
            <span class="text-xs text-gray-500">Renge tıklayınca görsel doğrudan güncellenir</span>
          </div>
          <span id="selectedColorTitle" class="text-xs font-semibold text-gray-800 bg-white px-2.5 py-1 rounded-lg border border-gray-200">
            Siyah
          </span>
        </div>
        <div id="colorContainer" class="flex flex-wrap gap-3">
          <!-- Renk hapları JS ile dolacak -->
        </div>
      </div>

      <!-- 4. BEDEN VE TOPTAN SİPARİŞ MATRİSİ -->
      <div class="mt-auto pt-4 border-t border-gray-100">
        <label class="text-[11px] font-bold text-gray-400 tracking-wider uppercase block mb-2.5">Beden Asorti / Adet Dağılımı</label>
        <div class="grid grid-cols-5 gap-2 mb-4">
          <div class="text-center p-2 rounded-xl bg-gray-50 border border-gray-200">
            <span class="text-[11px] font-semibold text-gray-500 block mb-1">S</span>
            <input type="number" value="2" min="0" class="w-full text-center font-bold text-sm bg-white rounded border border-gray-300 py-1" />
          </div>
          <div class="text-center p-2 rounded-xl bg-gray-50 border border-gray-200">
            <span class="text-[11px] font-semibold text-gray-500 block mb-1">M</span>
            <input type="number" value="4" min="0" class="w-full text-center font-bold text-sm bg-white rounded border border-gray-300 py-1" />
          </div>
          <div class="text-center p-2 rounded-xl bg-gray-50 border border-gray-200">
            <span class="text-[11px] font-semibold text-gray-500 block mb-1">L</span>
            <input type="number" value="4" min="0" class="w-full text-center font-bold text-sm bg-white rounded border border-gray-300 py-1" />
          </div>
          <div class="text-center p-2 rounded-xl bg-gray-50 border border-gray-200">
            <span class="text-[11px] font-semibold text-gray-500 block mb-1">XL</span>
            <input type="number" value="2" min="0" class="w-full text-center font-bold text-sm bg-white rounded border border-gray-300 py-1" />
          </div>
          <div class="text-center p-2 rounded-xl bg-gray-50 border border-gray-200">
            <span class="text-[11px] font-semibold text-gray-500 block mb-1">XXL</span>
            <input type="number" value="1" min="0" class="w-full text-center font-bold text-sm bg-white rounded border border-gray-300 py-1" />
          </div>
        </div>

        <button class="w-full bg-black hover:bg-gray-800 active:scale-[0.99] text-white py-3.5 px-4 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 shadow-sm">
          <span>Seçili Varyantı Linesheet'e Ekle (13 Adet)</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>

    </section>

  </main>

  <!-- ================= INTERACTIVE SCRIPT ================= -->
  <script>
    // Raymons Linesheet Veri Yapısı
    const CATALOG_DATA = [
      {
        id: "montlar",
        name: "Montlar",
        products: [
          {
            sku: "M1001",
            title: "Technical Puffer Parka",
            price: "€185.00",
            colors: [
              {
                id: "black",
                name: "Mat Siyah",
                hex: "#1A1A1A",
                // Unsplash yüksek çözünürlüklü moda görselleri
                image: "https://images.unsplash.com/photo-1544923246-77307dd654cb?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "olive",
                name: "Haki Yeşil",
                hex: "#3D4839",
                image: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "camel",
                name: "Camel Taba",
                hex: "#B88656",
                image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1200&auto=format&fit=crop"
              }
            ]
          },
          {
            sku: "M1002",
            title: "Yün Kaşe Overcoat",
            price: "€220.00",
            colors: [
              {
                id: "navy",
                name: "Gece Mavisi",
                hex: "#1E293B",
                image: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "charcoal",
                name: "Antrasit Gri",
                hex: "#4B5563",
                image: "https://images.unsplash.com/photo-1520975916090-3105956dac38?q=80&w=1200&auto=format&fit=crop"
              }
            ]
          },
          {
            sku: "M1003",
            title: "Su Geçirmez Shell Mont",
            price: "€145.00",
            colors: [
              {
                id: "orange",
                name: "Yanık Turuncu",
                hex: "#C2410C",
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "black",
                name: "Derin Siyah",
                hex: "#0F172A",
                image: "https://images.unsplash.com/photo-1548883354-7622d03aca27?q=80&w=1200&auto=format&fit=crop"
              }
            ]
          }
        ]
      },
      {
        id: "yelekler",
        name: "Yelekler",
        products: [
          {
            sku: "Y2001",
            title: "Kapitone Dolgulu Yelek",
            price: "€95.00",
            colors: [
              {
                id: "darkgreen",
                name: "Orman Yeşili",
                hex: "#14532D",
                image: "https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "black",
                name: "Siyah",
                hex: "#18181B",
                image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=1200&auto=format&fit=crop"
              }
            ]
          }
        ]
      },
      {
        id: "gomlekler",
        name: "Gömlekler",
        products: [
          {
            sku: "G3001",
            title: "Oversize Oxford Gömlek",
            price: "€65.00",
            colors: [
              {
                id: "white",
                name: "Optik Beyaz",
                hex: "#F8FAFC",
                image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=1200&auto=format&fit=crop"
              },
              {
                id: "lightblue",
                name: "Açık Mavi",
                hex: "#93C5FD",
                image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?q=80&w=1200&auto=format&fit=crop"
              }
            ]
          }
        ]
      },
      {
        id: "ceketler",
        name: "Ceketler",
        products: []
      },
      {
        id: "pantolonlar",
        name: "Pantolonlar",
        products: []
      }
    ];

    // Aktif Durum (State)
    let activeCategoryId = "montlar";
    let activeSku = "M1001";
    let activeColorId = "black";

    // DOM Elementleri
    const categoryContainer = document.getElementById("categoryContainer");
    const productGrid = document.getElementById("productGrid");
    const colorContainer = document.getElementById("colorContainer");
    const skuCountLabel = document.getElementById("skuCountLabel");
    
    // Görsel Alanı DOM
    const mainProductImage = document.getElementById("mainProductImage");
    const badgeSku = document.getElementById("badgeSku");
    const badgeColorName = document.getElementById("badgeColorName");
    const badgeColorDot = document.getElementById("badgeColorDot");
    const badgePrice = document.getElementById("badgePrice");
    const selectedColorTitle = document.getElementById("selectedColorTitle");

    // 1. Kategorileri Çiz
    function renderCategories() {
      categoryContainer.innerHTML = "";
      CATALOG_DATA.forEach(cat => {
        const isActive = cat.id === activeCategoryId;
        const button = document.createElement("button");
        button.className = `px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
          isActive 
            ? "bg-black text-white shadow-sm" 
            : "bg-gray-100 text-gray-600 hover:bg-gray-200"
        }`;
        button.innerText = cat.name;
        button.onclick = () => {
          activeCategoryId = cat.id;
          const currentCat = CATALOG_DATA.find(c => c.id === activeCategoryId);
          if (currentCat && currentCat.products.length > 0) {
            activeSku = currentCat.products[0].sku;
            activeColorId = currentCat.products[0].colors[0]?.id || "";
          } else {
            activeSku = null;
            activeColorId = null;
          }
          renderCategories();
          renderProducts();
          renderColors();
          updateMainImage();
        };
        categoryContainer.appendChild(button);
      });
    }

    // 2. Ürünleri (SKU) Çiz
    function renderProducts() {
      productGrid.innerHTML = "";
      const currentCat = CATALOG_DATA.find(c => c.id === activeCategoryId);

      if (!currentCat || currentCat.products.length === 0) {
        productGrid.innerHTML = `<p class="col-span-full text-xs text-gray-400 py-4">Bu kategoride henüz ürün bulunmuyor.</p>`;
        skuCountLabel.innerText = "0 Ürün";
        return;
      }

      skuCountLabel.innerText = `${currentCat.products.length} Ürün`;

      currentCat.products.forEach(prod => {
        const isActive = prod.sku === activeSku;
        const card = document.createElement("button");
        card.className = `p-3 rounded-xl text-left border transition-all ${
          isActive 
            ? "border-black bg-black text-white shadow-md ring-1 ring-black" 
            : "border-gray-200 bg-white hover:border-gray-300 text-gray-900"
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-xs tracking-wider">${prod.sku}</span>
            <span class="text-[10px] ${isActive ? "text-gray-300" : "text-gray-500"}">${prod.price}</span>
          </div>
          <div class="text-[11px] font-medium truncate ${isActive ? "text-gray-200" : "text-gray-600"}">${prod.title}</div>
          <div class="flex items-center gap-1 mt-2">
            ${prod.colors.map(col => `<span class="w-2 h-2 rounded-full border border-black/20" style="background-color: ${col.hex}"></span>`).join("")}
          </div>
        `;

        card.onclick = () => {
          activeSku = prod.sku;
          activeColorId = prod.colors[0]?.id || "";
          renderProducts();
          renderColors();
          updateMainImage();
        };

        productGrid.appendChild(card);
      });
    }

    // 3. Renk Haplarını Çiz
    function renderColors() {
      colorContainer.innerHTML = "";
      const currentCat = CATALOG_DATA.find(c => c.id === activeCategoryId);
      const currentProduct = currentCat?.products.find(p => p.sku === activeSku);

      if (!currentProduct || !currentProduct.colors.length) {
        colorContainer.innerHTML = `<span class="text-xs text-gray-400">Renk varyantı yok</span>`;
        return;
      }

      currentProduct.colors.forEach(col => {
        const isActive = col.id === activeColorId;
        const btn = document.createElement("button");
        btn.className = `flex items-center gap-2.5 px-3.5 py-2 rounded-xl border text-xs font-medium transition-all ${
          isActive 
            ? "border-black bg-white text-black shadow-sm ring-2 ring-black" 
            : "border-gray-200 bg-white text-gray-700 hover:border-gray-300"
        }`;

        btn.innerHTML = `
          <span class="w-4 h-4 rounded-full border border-black/10 shadow-inner" style="background-color: ${col.hex}"></span>
          <span>${col.name}</span>
        `;

        btn.onclick = () => {
          activeColorId = col.id;
          renderColors();
          updateMainImage();
        };

        colorContainer.appendChild(btn);
      });
    }

    // 4. Görseli & Rozetleri Güncelle
    function updateMainImage() {
      const currentCat = CATALOG_DATA.find(c => c.id === activeCategoryId);
      const currentProduct = currentCat?.products.find(p => p.sku === activeSku);
      const currentColor = currentProduct?.colors.find(col => col.id === activeColorId);

      if (currentColor) {
        // Yumuşak geçiş efekti
        mainProductImage.style.opacity = "0.2";
        setTimeout(() => {
          mainProductImage.src = currentColor.image;
          mainProductImage.style.opacity = "1";
        }, 150);

        badgeSku.innerText = currentProduct.sku;
        badgeColorName.innerText = currentColor.name;
        badgeColorDot.style.backgroundColor = currentColor.hex;
        badgePrice.innerText = currentProduct.price;
        selectedColorTitle.innerText = `${currentColor.name} Seçildi`;
      }
    }

    // İlk Başlatma
    renderCategories();
    renderProducts();
    renderColors();
    updateMainImage();
  </script>
</body>
</html>
